services:
  - type: web
    name: voice-agent
    runtime: node
    plan: free
    buildCommand: 'true'
    startCommand: npm start
    envVars:
      # sync: false is what makes Render prompt for a value during Blueprint
      # creation. Everything below with a literal value is set for you and can
      # be changed afterwards under Environment on the service.
      - key: ASSEMBLYAI_API_KEY
        sync: false
      # Which agents/<name>.jsonc the service publishes on boot.
      - key: AGENT
        value: minimal
      # REST, token, and browser WebSocket traffic must use the same region.
      - key: AGENTS_API_BASE
        value: https://agents.assemblyai.com/v1
      # Optional id verified in this production account and region. Left empty,
      # the service publishes AGENT and reuses the matching name on restarts.
      - key: AGENT_ID
        value: ''
